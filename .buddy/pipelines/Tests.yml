- pipeline: tests
  name: Tests
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  actions:
  - action: docker push container.registry.sh/meechain-magic-hall/mmcb:latest
    type: VM_LINUX
    commands: |
      # ดาวน์โหลดระบบ Android
      sudo waydroid init -s GAPPS -f

      # เริ่มใช้งาน
      sudo systemctl start waydroid-container
      waydroid session start
      waydroid show-full-ui
    instance_type: GENERAL_MEDIUM
    mount_paths:
    - pipeline_path: /
      vm_path: /buddy
