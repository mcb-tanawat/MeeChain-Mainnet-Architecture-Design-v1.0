- pipeline: tests
  name: Tests
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  concurrent_pipeline_runs: true
  events:
  - type: WEBHOOK
  actions:
  - action: docker push container.registry.sh/meechain-magic-hall/mmcb:latest
    type: VM_LINUX
    trigger_conditions:
    - trigger_condition: ON_CHANGE_AT_PATH
      trigger_condition_paths:
      - /
    commands: apt update
    instance_type: GENERAL_MEDIUM
    mount_paths:
    - pipeline_path: /
      vm_path: /buddy
