- pipeline: tests
  name: Tests
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  concurrent_pipeline_runs: true
  events:
  - type: WEBHOOK
  actions:
  - action: docker push container.registry.sh/meechain-magic-hall/mmcb:latest
    type: VM_LINUX
    trigger_conditions:
    - trigger_condition: ON_CHANGE_AT_PATH
      trigger_condition_paths:
      - /
    commands: |-
      curl https://es.buddy.works/bdy/prod/1.25.20/linux-x64.tar.gz -o bdy.tar.gz
      sudo tar -zxf bdy.tar.gz -C /usr/local/bin/
    instance_type: GENERAL_MEDIUM
    mount_paths:
    - pipeline_path: /
      vm_path: /buddy
