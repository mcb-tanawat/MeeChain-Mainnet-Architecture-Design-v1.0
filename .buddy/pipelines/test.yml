- pipeline: test
  refs:
  - refs/heads/compliance/matrix-detailed-v0.1
  disabled: true
  always_from_scratch: true
  ignore_fail_on_project_status: true
  skip_queued_runs: SAME_ENVIRONMENT
  auto_clear_cache: true
  fetch_lfs: true
  do_not_create_commit_status: true
  git_changeset_base: PULL_REQUEST
  description_required: true
  environments:
  - '*'
  events:
  - type: WEBHOOK
  artifacts:
  - '*'
  trigger_conditions:
  - trigger_condition: ON_CHANGE
  arch: ARM64
  docker_build_cache: WORKSPACE
  actions:
  - action: "docker buildx build --cache-to=\"type=gha,mode=max\" --cache-from=\"type=gha\" --builder=buildx-builder ."
    type: NATIVE_BUILD_DOCKER_CLI
    commands: |-
      docker context create docker-context
      docker buildx create --name buildx-builder --use docker-context --bootstrap --driver=docker-container
      docker buildx build --cache-to="type=gha,mode=max" --cache-from="type=gha" --builder=buildx-builder .
    instance_type: GENERAL_MEDIUM
